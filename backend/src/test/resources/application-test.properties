# Test configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway for tests (use JPA schema generation)
spring.flyway.enabled=false

# JWT Configuration for tests
jwt.secret=test-secret-key-minimum-32-characters-long-for-hs256-algorithm
jwt.expiration=900000
jwt.refresh-token.expiration=604800000
jwt.cookie.name=auth_token
jwt.cookie.http-only=true
jwt.cookie.secure=false
jwt.cookie.same-site=Lax
jwt.cookie.max-age=900
jwt.refresh-cookie.name=refresh_token
jwt.refresh-cookie.max-age=604800

# CORS for tests
cors.allowed-origins=http://localhost:5173,http://localhost:3000
frontend.url=http://localhost:5173
backend.url=http://localhost:8080

# Disable actual OAuth for tests
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret

# Disable problem validation for tests
validation.enabled=false

# Logging
logging.level.com.coderace=DEBUG
